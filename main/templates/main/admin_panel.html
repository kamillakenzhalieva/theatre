{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления</title>
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
</head>
<body>


<div id="staff-calendar-popover" class="staff-popover-calendar" style="display: none;">
    <div class="staff-popover-header">
        <span id="staff-cal-name">Сотрудник</span>
        <button onclick="closeStaffCalendar()" style="border:none; background:none; cursor:pointer;">×</button>
    </div>
    <div id="staff-mini-calendar"></div>
</div>


<div id="roles-popover" class="roles-popover" style="display: none;">
    <div class="roles-popover-content" id="roles-list-content"></div>
    <div class="popover-arrow"></div>
</div>

<
<div id="success-toast" class="success-toast" style="display:none;">
    <div class="success-toast-icon">✓</div>
    <span id="toast-text">Действие выполнено!</span>
</div>


<div id="custom-confirm-modal" class="modal-overlay" style="display:none; z-index: 11000;">
    <div class="modal-card" style="max-width: 400px; text-align: center; border: 2px solid var(--mint);">
        <div class="modal-body" style="padding: 40px 20px;">
            <h3>Одобрить заявку?</h3>
            <p style="color: #666; margin-bottom: 30px;">Статус изменится на «Одобрено», команда будет назначена.</p>
            <div style="display: flex; gap: 15px;">
                <button type="button" class="btn" onclick="closeApproveConfirm()" style="background: #eee; flex: 1;">Отмена</button>
                <button type="button" class="btn btn-add" onclick="executeApprove()" style="flex: 1;">Да, одобрить</button>
            </div>
        </div>
    </div>
</div>


<div id="roles-popover" class="roles-popover" style="display: none;">
    <div class="roles-popover-content" id="roles-list-content"></div>
    <div class="popover-arrow"></div>
</div>

<div class="admin-container">
    <div class="sidebar">
        <h2>Админ-панель</h2>
        <button class="nav-btn active" onclick="loadSection('events')">Спектакли</button>
        <button class="nav-btn" onclick="loadSection('tariffs')">Тарифы</button>
        <button class="nav-btn" onclick="loadSection('applications')">Заявки</button>
        <button class="nav-btn" onclick="loadSection('staff')">Сотрудники</button>
        <button class="nav-btn" onclick="loadSection('home')">Главная и Контакты</button>
        <button class="nav-btn" onclick="loadSection('calendar')">Календарь</button>
        <hr style="width: 100%; border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <a href="{% url 'home' %}" style="text-decoration: none; color: #666; font-size: 14px; padding: 10px;">← На сайт</a>
    </div>

    <div class="main-content">
        <div class="header-actions">
            <h1 id="section-title">Спектакли</h1>
            <button class="btn btn-add" id="add-btn" onclick="openCreateModal()">+ Добавить запись</button>
        </div>
        <div id="content-area">
            <table class="admin-table">
                <thead><tr id="table-head"></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div> 

<div id="modal-overlay" class="modal-overlay">
    <div class="modal-card1">
        <h2 id="modal-title" style="margin-top: 0; font-size: 20px;">Редактировать запись</h2>
        <form id="admin-form" enctype="multipart/form-data">
            <input type="hidden" name="id" id="field-id">
            <div id="form-fields"></div>
            <div style="margin-top: 25px; display: flex; justify-content: space-between; align-items: center;">
                <div id="assignment-container">
                    <div class="custom-select-wrapper">
                        <div class="custom-select-trigger" onclick="toggleAssignMenu(event)">Выберите команду...</div>
                        <div class="custom-options" id="custom-options-list">
                            <div class="option-add" onclick="openGroupCreator()">+ Создать команду</div>
                            <div id="groups-list-area"></div>
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button type="button" class="btn" onclick="closeModal()" style="background: #eee;">Отмена</button>
                    <button type="button" id="approve-btn" class="btn btn-add" onclick="approveApplication()">Одобрить</button>
                    <button type="submit" class="btn btn-add">Сохранить</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="group-creator-popup" class="floating-popup" style="display: none;">
    <div class="popup-header" id="popup-drag">
        <span>Новая команда</span>
        <button type="button" onclick="closeGroupCreator()">×</button>
    </div>
    <div class="popup-body">
        <input type="text" id="new-group-name" placeholder="Название команды..." class="form-field-input" style="margin-bottom: 10px;">
        <div id="staff-checklist" class="checklist"></div>
        <button type="button" class="btn btn-add" onclick="saveNewGroup()" style="width: 100%; margin-top: 15px;">Создать и выбрать</button>
    </div>
</div>

<div id="group-editor-popover" class="floating-popup" style="display: none; width: 250px;">
    <div class="popup-header">
        <span>Состав команды</span>
        <button type="button" onclick="closeGroupEditor()">×</button>
    </div>
    <div class="popup-body">
        <div id="edit-staff-checklist" class="checklist"></div>
        <button type="button" class="btn btn-add" id="update-group-btn" style="width: 100%; margin-top: 10px;">Обновить состав</button>
    </div>
    <div style="position: absolute; left: -10px; top: 20px; width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 10px solid white;"></div>
</div>

<div id="staff-calendar-popover" class="staff-popover-calendar" style="display: none;">
    <div class="staff-popover-header">
        <span id="staff-cal-name">Сотрудник</span>
        <button onclick="closeStaffCalendar()" style="border:none; background:none; cursor:pointer;">×</button>
    </div>
    <div id="staff-mini-calendar"></div>
</div>
<div id="roles-popover" class="roles-popover" style="display: none;">
    <div class="roles-popover-content" id="roles-list-content"></div>
    <div class="popover-arrow"></div>
</div>

<script>
    let currentSection = 'events';
    let selectedTarget = null;

    const schema = {
        'home': [
            { name: 'welcome_text', label: 'Заголовок приветствия', type: 'text' },
            { name: 'subtitle', label: 'Подзаголовок/Описание', type: 'textarea' },
            { name: 'banner_image', label: 'Главный баннер', type: 'file' },
            { name: 'phone', label: 'Телефон', type: 'text' },
            { name: 'email', label: 'Email для связи', type: 'text' },
            { name: 'address', label: 'Адрес театра', type: 'text' }
        ],
        'events': [
            { name: 'title', label: 'Название', type: 'text' },
            { name: 'image', label: 'Обложка (картинка)', type: 'file' },
            { name: 'short_description', label: 'Краткое описание', type: 'text' },
            { name: 'description', label: 'Полное описание', type: 'textarea' },
            { name: 'date', label: 'Дата', type: 'date' },
            { name: 'time', label: 'Время', type: 'time' },
            { name: 'location', label: 'Локация', type: 'text' },
            { name: 'price', label: 'Цена', type: 'number' },
            { name: 'is_active', label: 'Отображать на сайте', type: 'checkbox' }
        ],
        'tariffs': [
            { name: 'category', label: 'Категория', type: 'select', options: [
                { value: 'birthday', label: 'День рождения' },
                { value: 'graduation', label: 'Выпускной' },
                { value: 'spectacle', label: 'Спектакль' }
            ]},
            { name: 'name', label: 'Название тарифа', type: 'text' },
            { name: 'price', label: 'Цена', type: 'number' },
            { name: 'features_list', label: 'Список услуг', type: 'textarea' }
        ],
        'applications': [
            { name: 'category', label: 'Категория', type: 'select', options: [
                { value: 'birthday', label: 'День рождения' },
                { value: 'graduation', label: 'Выпускной' },
                { value: 'spectacle', label: 'Спектакль' }
            ]},
            { name: 'status', label: 'Статус', type: 'select', options: [
                { value: 'processing', label: 'На рассмотрении' },
                { value: 'approved', label: 'Одобрено' },
            ]},
            { name: 'full_name', label: 'ФИО заказчика', type: 'text' },
            { name: 'phone', label: 'Телефон', type: 'text' },
            { name: 'email', label: 'Email', type: 'text' },
            { name: 'age', label: 'Возраст детей', type: 'text' },
            { name: 'address', label: 'Адрес', type: 'text' },
            { name: 'event_date', label: 'Дата события', type: 'date' },
            { name: 'event_time', label: 'Время события', type: 'time' },
            { name: 'tariff', label: 'Выбранный тариф', type: 'text' }, 
            { name: 'chosen_show', label: 'Шоу-программа', type: 'text' },
            { name: 'chosen_program', label: 'Интерактив', type: 'text' },
            { name: 'guests_count', label: 'Кол-во гостей', type: 'number' },
            { name: 'message', label: 'Комментарий', type: 'textarea' }
        ],
        'staff': [
            { name: 'full_name', label: 'ФИО сотрудника', type: 'text' },
            { name: 'role', label: 'Роль', type: 'text' }
        ]
    };

    async function getStaffAndGroups() {
        const [s, g] = await Promise.all([fetch('/api/staff/'), fetch('/api/groups/')]);
        return { staff: await s.json(), groups: await g.json() };
    }

    async function filterAvailable(staff, groups, appId) {
        const avS = [], avG = [];
        for (const g of groups) {
            const r = await fetch('/api/assignments/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ application: appId, group: g.id, dry_run: true })
            });
            if (r.status === 200) avG.push(g);
        }
        for (const s of staff) {
            const r = await fetch('/api/assignments/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ application: appId, staff: s.id, dry_run: true })
            });
            if (r.status === 200) avS.push(s);
        }
        return { avS, avG };
    }

    function toggleAssignMenu(e) {
        if(e) e.stopPropagation();
        document.getElementById('custom-options-list').classList.toggle('show');
    }

    async function refreshGroupsList() {
        const appId = document.getElementById('field-id').value;
        const area = document.getElementById('groups-list-area');
        area.innerHTML = '<div style="padding:10px; font-size:12px; color:#999;">Проверка...</div>';
        
        const { staff, groups } = await getStaffAndGroups();
        const { avG } = await filterAvailable(staff, groups, appId);
        
        area.innerHTML = avG.length ? '' : '<div style="padding:10px; font-size:12px; color:#ff6b6b;">Нет свободных команд</div>';
        avG.forEach(g => {
            const d = document.createElement('div');
            d.className = 'option-item';
            d.style.display = 'flex';
            d.style.justifyContent = 'space-between';
            d.innerHTML = `<span>${g.name}</span> <small style="color: #999; font-size: 10px; cursor:pointer;">ред.</small>`;
            d.ondblclick = (e) => { e.stopPropagation(); renameGroup(g.id, g.name); };
            d.onclick = () => {
                selectedTarget = { type: 'group', id: g.id };
                document.querySelector('.custom-select-trigger').innerText = g.name;
                toggleAssignMenu();
            };
            d.querySelector('small').onclick = (e) => { e.stopPropagation(); openGroupEditor(e, g); };
            area.appendChild(d);
        });
    }

    async function openGroupEditor(e, group) {
        const appId = document.getElementById('field-id').value;
        const { staff } = await getStaffAndGroups();
        const { avS } = await filterAvailable(staff, [], appId);
        const pop = document.getElementById('group-editor-popover');
        const cl = document.getElementById('edit-staff-checklist');
        const rect = e.target.getBoundingClientRect();
        
        pop.style.display = 'block';
        pop.style.top = `${rect.top - 10}px`;
        pop.style.left = `${rect.right + 15}px`;
        pop.style.transform = 'none';

        cl.innerHTML = staff.map(s => {
            const isMem = group.members.includes(s.id);
            const isAv = avS.some(av => av.id === s.id) || isMem;
            if (!isAv) return '';
            return `<label class="check-item"><input type="checkbox" name="edit-staff-check" value="${s.id}" ${isMem ? 'checked' : ''}> ${s.full_name}</label>`;
        }).join('');

        document.getElementById('update-group-btn').onclick = async () => {
            const ids = Array.from(document.querySelectorAll('input[name="edit-staff-check"]:checked')).map(i => i.value);
            if (!ids.length) return alert("Выберите сотрудников");
            const r = await fetch(`/api/groups/${group.id}/`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ members: ids })
            });
            if (r.ok) { closeGroupEditor(); refreshGroupsList(); }
        };
    }

    function closeGroupEditor() { document.getElementById('group-editor-popover').style.display = 'none'; }

    async function renameGroup(id, old) {
        const n = prompt("Новое название:", old);
        if (n && n !== old) {
            await fetch(`/api/groups/${id}/`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ name: n })
            });
            refreshGroupsList();
        }
    }

    async function openGroupCreator() {
        const appId = document.getElementById('field-id').value;
        const { staff } = await getStaffAndGroups();
        const { avS } = await filterAvailable(staff, [], appId);
        const cl = document.getElementById('staff-checklist');
        cl.innerHTML = avS.length ? avS.map(s => `<label class="check-item"><input type="checkbox" name="staff-check" value="${s.id}"> ${s.full_name}</label>`).join('') : '<div style="font-size:12px; color:red; padding:10px;">Нет свободных сотрудников</div>';
        document.getElementById('group-creator-popup').style.display = 'block';
        toggleAssignMenu();
    }

    async function saveNewGroup() {
        const name = document.getElementById('new-group-name').value;
        const ids = Array.from(document.querySelectorAll('input[name="staff-check"]:checked')).map(i => i.value);
        if(!name || !ids.length) return alert("Заполните данные");
        const r = await fetch('/api/groups/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify({ name: name, members: ids })
        });
        if(r.ok) {
            const ng = await r.json();
            closeGroupCreator();
            await refreshGroupsList();
            selectedTarget = { type: 'group', id: ng.id };
            document.querySelector('.custom-select-trigger').innerText = name;
        }
    }

    function closeGroupCreator() { document.getElementById('group-creator-popup').style.display = 'none'; }

    async function loadSection(section) {
        currentSection = section;
        const contentArea = document.getElementById('content-area');
        const addBtn = document.getElementById('add-btn');
        const titleEl = document.getElementById('section-title');
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        const titles = { 'events': 'Управление спектаклями', 'tariffs': 'Настройка тарифов', 'applications': 'Входящие заявки', 'home': 'Главная страница и контакты', 'calendar': 'Календарь мероприятий', 'staff': 'Сотрудники театра' };
        titleEl.innerText = titles[section] || 'Панель управления';
        if (addBtn) addBtn.style.display = (['events', 'tariffs', 'staff'].includes(section)) ? 'block' : 'none';
        if (section === 'calendar') {
            try {
                const response = await fetch('/calendar-page/');
                const html = await response.text();
                contentArea.innerHTML = html;
                const scripts = contentArea.querySelectorAll("script");
                scripts.forEach(oldScript => {
                    const newScript = document.createElement("script");
                    newScript.text = oldScript.text;
                    document.head.appendChild(newScript).parentNode.removeChild(newScript);
                });
                setTimeout(() => { if (window.initFullCalendar) window.initFullCalendar(); }, 50);
            } catch (e) { contentArea.innerHTML = 'Ошибка загрузки'; }
            return;
        }
        contentArea.innerHTML = `<table class="admin-table"><thead><tr id="table-head"></tr></thead><tbody id="table-body"></tbody></table>`;
        try {
            const response = await fetch(`/api/${section}/`);
            const data = await response.json();
            section === 'home' ? renderHomeSection(data) : renderTable(data);
        } catch (e) { document.getElementById('table-body').innerHTML = '<tr><td>Ошибка</td></tr>'; }
    }

    function formatDate(isoString) {
        if (!isoString) return '-';
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return isoString;
        const d = String(date.getDate()).padStart(2, '0'), m = String(date.getMonth() + 1).padStart(2, '0'), y = date.getFullYear();
        const h = String(date.getHours()).padStart(2, '0'), min = String(date.getMinutes()).padStart(2, '0');
        return `${d}.${m}.${y} ${h}:${min}`;
    }

    function renderTable(data) {
    const head = document.getElementById('table-head'), body = document.getElementById('table-body');
    head.innerHTML = ''; body.innerHTML = '';
    if (!data || data.length === 0) { body.innerHTML = '<tr><td colspan="100%">Пусто</td></tr>'; return; }

    const isApp = currentSection === 'applications';
    
    let keys = isApp ? ['full_name', 'phone', 'event_date'] : 
            (currentSection === 'events' ? ['title', 'date', 'price'] : 
            (currentSection === 'staff' ? ['full_name', 'role', 'calendar_btn'] : ['name', 'price', 'category']));

    let labels = isApp ? ['ИМЯ', 'НОМЕР', 'ДАТА'] : 
                (currentSection === 'events' ? ['НАЗВАНИЕ', 'ДАТА', 'ЦЕНА'] : 
                (currentSection === 'staff' ? ['ИМЯ', 'РОЛЬ', 'ГРАФИК'] : ['НАЗВАНИЕ', 'ЦЕНА', 'КАТЕГОРИЯ']));

    labels.forEach(l => head.innerHTML += `<th>${l}</th>`);
    head.innerHTML += `<th>${isApp ? 'СТАТУС' : 'ДЕЙСТВИЯ'}</th>`;

    data.forEach(item => {
        if (isApp && item.status === 'approved') return;
        let row = `<tr class="${isApp ? 'clickable-row' : ''}" onclick='${isApp ? `openEditModal(${JSON.stringify(item)})` : ""}'>`;
        
        keys.forEach(k => {
            if (k === 'calendar_btn') {
                row += `<td><button class="staff-calendar-trigger" onclick="event.stopPropagation(); openStaffCalendar(event, ${item.id}, '${item.full_name}')">📅 Календарь</button></td>`;
            } 
            else if (k === 'role') {
                const rolesData = JSON.stringify(item.roles || []).replace(/"/g, '&quot;');
                row += `<td><button class="staff-minor-btn" onclick="event.stopPropagation(); openRolesPopover(event, ${rolesData})">посмотреть</button></td>`;
            } 
            else if (isApp && k === 'event_date') {
                let datePart = item.event_date ? item.event_date.split('-').reverse().join('.') : '-';
                let timePart = item.event_time ? item.event_time.substring(0, 5) : '00:00';
                
                row += `<td>${datePart} ${timePart}</td>`;
            }
            else {
                let v = item[k] || '-';
                if (!isApp && (k === 'date' || k === 'event_date')) v = formatDate(v);
                row += `<td>${v}</td>`;
            }
        });

        if (isApp) {
            const trans = {'pending': 'Новая заявка!', 'processing': 'На рассмотрении'};
            row += `<td class="table-status-wrapper"><span class="status-badge status-${item.status}">${trans[item.status] || item.status}</span><button class="table-quick-remove" onclick="event.stopPropagation(); deleteItem(${item.id})">&times;</button></td>`;
        } else {
            row += `<td><button class="btn btn-edit" onclick='openEditModal(${JSON.stringify(item)})'>Редактировать</button><button class="btn btn-delete" onclick="event.stopPropagation(); deleteItem(${item.id})">Удалить</button></td>`;
        }
        row += `</tr>`;
        body.innerHTML += row;
        });
    }

    function renderHomeSection(data) {
        const body = document.getElementById('table-body'), item = (Array.isArray(data) && data.length > 0) ? data[0] : (data.id ? data : null);
        if (!item) { body.innerHTML = '<tr><td>Нет данных</td></tr>'; return; }
        body.innerHTML = `<tr><td colspan="100%" style="padding: 40px; text-align: center;"><div style="background: white; padding: 30px; border-radius: 20px; display: inline-block; border: 2px solid var(--mint);"><h2>${item.welcome_text || ''}</h2><p>📍 ${item.address || ''}</p><p>📞 ${item.phone || ''}</p><button class="btn btn-edit" onclick='openEditModal(${JSON.stringify(item)})'>🔧 Редактировать</button></div></td></tr>`;
    }

    function generateFormFields(item = null) {
        const container = document.getElementById('form-fields');
        container.innerHTML = '';
        const cat = item ? item.category : '';
        schema[currentSection].forEach(field => {
            if (currentSection === 'applications' && cat === 'spectacle' && ['tariff', 'chosen_show', 'chosen_program'].includes(field.name)) return;
            let sk = (currentSection === 'events' && field.name === 'time') ? 'date' : field.name;
            let val = item ? item[sk] : '';
            if (val && (field.type === 'date' || field.type === 'time')) {
                const d = new Date(val);
                if (!isNaN(d.getTime())) {
                    if (field.type === 'date') val = d.toLocaleDateString('en-CA');
                    else val = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                }
            }
            let html;
            if (field.type === 'select') {
                html = `<select name="${field.name}" class="form-field-select" ${field.name === 'category' ? 'onchange="refreshModal(this)"' : ''}>${field.options.map(o => `<option value="${o.value}" ${val === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}</select>`;
            } else if (field.type === 'textarea') {
                html = `<textarea name="${field.name}" class="form-field-textarea" rows="3">${val || ''}</textarea>`;
            } else if (field.type === 'checkbox') {
                html = `<input type="checkbox" name="${field.name}" class="form-field-checkbox" ${val === true || val === 'true' ? 'checked' : ''}>`;
            } else {
                const ro = ['tariff', 'chosen_show', 'chosen_program'].includes(field.name) ? 'readonly style="background: #f9f9f9;"' : '';
                html = `<input type="${field.type}" name="${field.name}" class="form-field-input" value="${val || ''}" ${ro}>`;
            }
            container.insertAdjacentHTML('beforeend', `<div class="form-group"><label class="form-field-label">${field.label}</label>${html}</div>`);
        });
    }

    function openCreateModal() {
        document.getElementById('modal-title').innerText = "Добавить запись";
        document.getElementById('field-id').value = ''; 
        document.getElementById('approve-btn').style.display = 'none';
        document.getElementById('assignment-container').style.display = 'none';
        generateFormFields();
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    async function openEditModal(item) {
        document.getElementById('modal-title').innerText = "Редактировать запись";
        document.getElementById('field-id').value = item.id;
        
        selectedTarget = null;
        const trigger = document.querySelector('.custom-select-trigger');
        trigger.innerText = "Выберите команду...";
        
        const ab = document.getElementById('approve-btn'), ac = document.getElementById('assignment-container');
        generateFormFields(item);
        
        if (currentSection === 'applications' || currentSection === 'events') {
            ac.style.display = 'block';
            
            try {
                const res = await fetch(`/api/assignments/?application=${item.id}`);
                const assignments = await res.json();
                
                if (assignments.length > 0) {
                    const active = assignments[0]; 
                    if (active.group_details) {
                        selectedTarget = { type: 'group', id: active.group };
                        trigger.innerText = active.group_details.name;
                    } else if (active.staff_details) {
                        selectedTarget = { type: 'staff', id: active.staff };
                        trigger.innerText = active.staff_details.full_name;
                    }
                }
            } catch (e) { console.error("Ошибка загрузки назначения:", e); }
            
            await refreshGroupsList();
        } else { ac.style.display = 'none'; }
        
        ab.style.display = (currentSection === 'applications' && item.status !== 'approved') ? 'block' : 'none';
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; document.getElementById('admin-form').reset(); }
    function refreshModal() { generateFormFields(Object.fromEntries(new FormData(document.getElementById('admin-form')).entries())); }

    document.getElementById('admin-form').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target), id = document.getElementById('field-id').value;
        const u = id ? `/api/${currentSection}/${id}/` : `/api/${currentSection}/`, m = id ? 'PUT' : 'POST';
        const r = await fetch(u, { method: m, headers: { 'X-CSRFToken': '{{ csrf_token }}' }, body: fd });
        if (r.ok) {
            const savedItem = await r.json();
            if (selectedTarget && (currentSection === 'applications' || currentSection === 'events')) {
                const aData = { application: id || savedItem.id, [selectedTarget.type]: selectedTarget.id };
                const ar = await fetch('/api/assignments/', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' }, 
                    body: JSON.stringify(aData) 
                });
                if(!ar.ok) { const e = await ar.json(); alert(e.non_field_errors?.[0] || 'Конфликт времени'); }
            }
            closeModal(); loadSection(currentSection); 
        } else alert('Ошибка');
    };

    async function deleteItem(id) { if (confirm('Удалить?')) { await fetch(`/api/${currentSection}/${id}/`, { method: 'DELETE', headers: { 'X-CSRFToken': '{{ csrf_token }}' } }); loadSection(currentSection); } }

    
    function approveApplication() {
        const id = document.getElementById('field-id').value;
        if (!id) return;
        document.getElementById('custom-confirm-modal').style.display = 'flex';
    }

    
    function closeApproveConfirm() {
        document.getElementById('custom-confirm-modal').style.display = 'none';
    }

   
    function showToast(text) {
        const toast = document.getElementById('success-toast');
        const textEl = document.getElementById('toast-text');
        if (toast && textEl) {
            textEl.innerText = text;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
    }

    
    async function executeApprove() {
        const id = document.getElementById('field-id').value;
        
        
        if (selectedTarget) {
            const aData = { application: id, [selectedTarget.type]: selectedTarget.id };
            const ar = await fetch('/api/assignments/', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' }, 
                body: JSON.stringify(aData) 
            });
            
            if (!ar.ok) { 
                const errData = await ar.json(); 
                alert(errData.detail || 'Конфликт: команда уже занята!'); 
                closeApproveConfirm(); 
                return; 
            }
        }

        
        const fd = new FormData(); 
        fd.append('status', 'approved');
        await fetch(`/api/applications/${id}/`, { 
            method: 'PATCH', 
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }, 
            body: fd 
        });

        closeApproveConfirm(); 
        closeModal(); 
        loadSection('applications');
        showToast("🚀 Заявка одобрена и команда назначена!");
    }

    document.addEventListener('click', (e) => { 
        if(!e.target.closest('.custom-select-wrapper')) document.getElementById('custom-options-list').classList.remove('show');
        if(!e.target.closest('#group-editor-popover') && !e.target.closest('.option-item')) closeGroupEditor();
    });
    
    const creatorP = document.getElementById("group-creator-popup"), creatorH = document.getElementById("popup-drag");
    let o = [0,0], d = false;
    creatorH.addEventListener('mousedown', (e) => { d = true; o = [creatorP.offsetLeft - e.clientX, creatorP.offsetTop - e.clientY]; });
    document.addEventListener('mouseup', () => d = false);
    document.addEventListener('mousemove', (e) => { if (d) { creatorP.style.left = (e.clientX + o[0]) + 'px'; creatorP.style.top = (e.clientY + o[1]) + 'px'; creatorP.style.transform = 'none'; } });

    let miniCalendar = null;

    async function openStaffCalendar(event, staffId, staffName) {
        event.stopPropagation();
        const popover = document.getElementById('staff-calendar-popover');
        const calendarEl = document.getElementById('staff-mini-calendar');
        const rect = event.target.getBoundingClientRect();
        
        document.getElementById('staff-cal-name').innerText = staffName;
        popover.style.display = 'block';
        popover.style.top = `${rect.bottom + window.scrollY + 10}px`;
        popover.style.left = `${rect.left + window.scrollX - 100}px`;

        try {
            if (miniCalendar) {
                miniCalendar.destroy();
                miniCalendar = null;
            }

            const response = await fetch(`/api/staff/${staffId}/busy_dates/`);
            const events = await response.json();

            setTimeout(() => {
                miniCalendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    headerToolbar: { left: 'prev', center: 'title', right: 'next' },
                    height: 'auto',
                    contentHeight: 'auto',
                    locale: 'ru',
                    firstDay: 1,
                    events: events, 
                    displayEventTime: true,
                    eventTimeFormat: { 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        meridiem: false,
                        hour12: false 
                    },
                    eventDidMount: function(info) {
                        info.el.title = info.event.title;
                    }
                });
                
                miniCalendar.render();
                setTimeout(() => miniCalendar.updateSize(), 50); 
            }, 10);

        } catch (e) {
            calendarEl.innerHTML = '<div style="padding:20px; color:red;">Ошибка загрузки дат</div>';
            console.error(e);
        }
    }

    function closeStaffCalendar() {
        document.getElementById('staff-calendar-popover').style.display = 'none';
    }

    function viewStaffDetails(id) {
        alert("Функционал просмотра профиля сотрудника ID:" + id + " в разработке");
    }

    loadSection('events');
    
    function openRolesPopover(event, roles) {
    const popover = document.getElementById('roles-popover');
    const content = document.getElementById('roles-list-content');
    
    
    content.innerHTML = roles.length > 0 
        ? roles.map(r => `<div style="padding: 3px 0; border-bottom: 1px solid #f0f0f0;">• ${r}</div>`).join('') 
        : '<em>Роли не указаны</em>';

    popover.style.display = 'block';

   
    const rect = event.target.getBoundingClientRect();
    
    
    popover.style.top = (rect.top + window.scrollY - (popover.offsetHeight / 2) + (rect.height / 2)) + 'px';
    popover.style.left = (rect.right + window.scrollX + 12) + 'px';

    
    const close = (e) => {
        if (!popover.contains(e.target) && e.target !== event.target) {
            popover.style.display = 'none';
            document.removeEventListener('click', close);
        }
    };
    setTimeout(() => document.addEventListener('click', close), 10);
}
    
</script>
</body>
</html>
